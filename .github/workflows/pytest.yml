name: Tests

on:
  pull_request:
    branches:
      - devtoprod
      - production
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcb-cursor0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify Qt TIFF plugin loads
        run: |
          uv run python -c "
          from PySide6.QtGui import QImageWriter
          f = sorted(bytes(x).decode() for x in QImageWriter.supportedImageFormats())
          print('writable formats:', f)
          assert 'tiff' in f, 'Qt TIFF plugin did not load'
          "

      - name: Run tests
        run: uv run pytest tests/ -v

  # The declared floors, on the lowest supported Python. Installed from a
  # hash-pinned lock (ci/requirements-min.txt), then the package itself with
  # --no-deps so nothing else is resolved. --no-config: [tool.uv]
  # constraint-dependencies (pip>=26.2) is not a == pin and would be
  # rejected under --require-hashes.
  minimum:
    name: Tests (minimum versions, Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcb-cursor0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Install minimum versions
        run: |
          uv venv --python 3.11
          uv pip install --no-config --require-hashes -r ci/requirements-min.txt
          uv pip install --no-config --no-deps -e .

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -v

      # Audited from Python 3.11, the lowest supported Python, so any
      # version-gated entries in the lock resolve as they were installed
      # above. pip-audit itself comes
      # from uv.lock (dev extra), in its own environment so it cannot touch
      # the minimum-versions .venv. colorama (Windows-only, via pytest) is
      # not audited on this Linux runner.
      - name: Run pip-audit on the minimum-versions lock
        env:
          UV_PROJECT_ENVIRONMENT: .venv-audit
        run: uv run --locked --extra dev --python 3.11 pip-audit -r ci/requirements-min.txt --require-hashes --disable-pip

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pyflakes
        run: uv run pyflakes pysternblot tests scripts launcher.py

  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pip-audit
        run: uv run pip-audit
