name: Build macOS App

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS .app
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"

      - name: Install dependencies
        run: uv sync --locked --extra build

      - name: Generate .icns icon from logo PNG
        run: |
          mkdir -p build/pysternblot.iconset
          sips -z 16 16     pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_16x16.png
          sips -z 32 32     pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_16x16@2x.png
          sips -z 32 32     pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_32x32.png
          sips -z 64 64     pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_32x32@2x.png
          sips -z 128 128   pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_128x128.png
          sips -z 256 256   pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_128x128@2x.png
          sips -z 256 256   pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_256x256.png
          sips -z 512 512   pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_256x256@2x.png
          sips -z 512 512   pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_512x512.png
          sips -z 1024 1024 pysternblot/resources/pb_logo2.png \
            --out build/pysternblot.iconset/icon_512x512@2x.png
          iconutil -c icns build/pysternblot.iconset \
            -o build/pysternblot.icns

      - name: Build .app with PyInstaller
        run: |
          uv run pyinstaller \
            --name "PysternBlot" \
            --windowed \
            --noconfirm \
            --icon "build/pysternblot.icns" \
            --add-data "pysternblot/resources:pysternblot/resources" \
            launcher.py

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" $RUNNER_TEMP/build.keychain
          security default-keychain -s $RUNNER_TEMP/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" $RUNNER_TEMP/build.keychain
          security import $RUNNER_TEMP/cert.p12 -k $RUNNER_TEMP/build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" \
            $RUNNER_TEMP/build.keychain
          rm $RUNNER_TEMP/cert.p12

      - name: Sign the app
        run: |
          codesign_with_retries() {
            for attempt in 1 2 3 4 5; do
              if codesign "$@"; then return 0; fi
              echo "codesign failed (attempt $attempt); retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            codesign "$@"
          }
          codesign_with_retries --force --deep --options runtime --timestamp \
            --entitlements .github/macos/entitlements.plist \
            --sign "Developer ID Application: Etienne Boulter (742L43ZVL2)" \
            dist/PysternBlot.app
          codesign --verify --deep --strict --verbose=2 dist/PysternBlot.app

      - name: Notarize and staple
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > $RUNNER_TEMP/api_key.p8
          ditto -c -k --keepParent dist/PysternBlot.app $RUNNER_TEMP/notarize.zip
          xcrun notarytool submit $RUNNER_TEMP/notarize.zip \
            --key $RUNNER_TEMP/api_key.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/PysternBlot.app
          xcrun stapler validate dist/PysternBlot.app
          rm $RUNNER_TEMP/api_key.p8 $RUNNER_TEMP/notarize.zip

      - name: Set version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Zip the .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PysternBlot.app \
            "PysternBlot-${{ steps.version.outputs.tag }}-macOS.zip"

      - name: Verify archived bundle
        run: |
          set -euo pipefail
          ARCHIVE="PysternBlot-${{ steps.version.outputs.tag }}-macOS.zip"
          VERIFY_DIR="$RUNNER_TEMP/verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$ARCHIVE" "$VERIFY_DIR"
          APP="$VERIFY_DIR/PysternBlot.app"

          SYMLINKS=$(find "$APP" -type l | wc -l | tr -d ' ')
          echo "Symbolic links preserved in archive: $SYMLINKS"
          if [ "$SYMLINKS" -lt 100 ]; then
            echo "::error::Archive flattened symbolic links ($SYMLINKS found, expected >= 100). The Qt .framework bundles are malformed and Gatekeeper will reject the app at launch."
            exit 1
          fi

          for NAME in QtGui QtCore QtWidgets; do
            LINK="$APP/Contents/Frameworks/PySide6/Qt/lib/${NAME}.framework/${NAME}"
            if [ ! -L "$LINK" ]; then
              echo "::error::${NAME}.framework/${NAME} is not a symbolic link in the archived bundle."
              exit 1
            fi
          done

          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 \
            | tee "$RUNNER_TEMP/codesign-verify.log"
          if grep -q "ambiguous" "$RUNNER_TEMP/codesign-verify.log"; then
            echo "::error::codesign reports an ambiguous bundle format in the archived app."
            exit 1
          fi

          xcrun stapler validate "$APP"

          echo "--- spctl assessment (informational) ---"
          spctl -a -t exec -vvv "$APP" || echo "spctl returned non-zero; review output above"

          rm -rf "$VERIFY_DIR"

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PysternBlot-${{ steps.version.outputs.tag }}-macOS
          path: PysternBlot-${{ steps.version.outputs.tag }}-macOS.zip
          retention-days: 7

      - name: Upload to GitHub Release (release runs)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: PysternBlot-${{ steps.version.outputs.tag }}-macOS.zip
