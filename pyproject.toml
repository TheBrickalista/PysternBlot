[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysternblot"
version = "1.0.4"
description = "Western blot panel builder with hierarchical lane annotations (GPLv3)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Etienne Boulter" },
  { name = "Chloé C. Féral" }
]
keywords = [
  "western blot",
  "immunoblot",
  "image annotation",
  "provenance",
  "figure",
  "microscopy",
  "bioinformatics",
  "reproducibility"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = [
  "PySide6>=6.6",
  "pydantic>=2.6",
  "numpy>=1.24",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.0"
]

[project.urls]
Homepage = "https://github.com/TheBrickalista/PysternBlot"
Repository = "https://github.com/TheBrickalista/PysternBlot"
Issues = "https://github.com/TheBrickalista/PysternBlot/issues"

[project.scripts]
pysternblot = "pysternblot.main:main"

[tool.setuptools.package-data]
pysternblot = ["resources/*", "resources/**/*"]
