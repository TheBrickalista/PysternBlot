name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual dry run: test, build, twine check and the signed app builds all
  # run; the PyPI upload is skipped (see the publish job's `if:`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcb-cursor0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"

      - name: Check release tag matches pyproject version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V=$(uv run --no-project python -c "
          import sys; sys.path.insert(0, 'scripts')
          from make_version_file import parse_version
          x, y, z = parse_version('pyproject.toml')
          print(f'{x}.{y}.{z}')
          ")
          if [ "$RELEASE_TAG" != "v$V" ]; then
            echo "::error::Release tag ($RELEASE_TAG) does not match pyproject.toml version (v$V)."
            exit 1
          fi
          echo "Release tag $RELEASE_TAG matches pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify Qt TIFF plugin loads
        run: |
          uv run python -c "
          from PySide6.QtGui import QImageWriter
          f = sorted(bytes(x).decode() for x in QImageWriter.supportedImageFormats())
          print('writable formats:', f)
          assert 'tiff' in f, 'Qt TIFF plugin did not load'
          "

      - name: Run tests
        run: uv run pytest tests/ -v

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # The build backend (setuptools) is pinned by hash in
      # ci/build-constraints.txt; see ci/build-constraints.in to regenerate.
      - name: Build distributions
        run: uv build --build-constraints ci/build-constraints.txt --require-hashes

      - name: Check distributions
        run: uv run twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Signed app builds run only after the tests pass, so a release whose tests
  # fail never gets binaries attached.
  build-macos:
    name: Build macOS app
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  build-windows:
    name: Build Windows app
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml

  # The PyPI upload cannot be undone, so it waits for the signed app builds.
  publish:
    name: Publish to PyPI
    needs: [build, build-macos, build-windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
