name: Build Windows App

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Generate .ico icon from logo PNG
        shell: bash
        run: |
          mkdir -p build
          python - <<'EOF'
          from PIL import Image
          img = Image.open("pysternblot/resources/pb_logo2.png").convert("RGBA")
          sizes = [16, 32, 48, 64, 128, 256]
          icons = [img.resize((s, s), Image.LANCZOS) for s in sizes]
          icons[0].save(
              "build/pysternblot.ico",
              format="ICO",
              sizes=[(s, s) for s in sizes],
              append_images=icons[1:]
          )
          print("Icon generated successfully")
          EOF

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller `
            --name "PysternBlot" `
            --windowed `
            --onefile `
            --noconfirm `
            --icon "build/pysternblot.ico" `
            --add-data "pysternblot/resources;pysternblot/resources" `
            launcher.py

      - name: Set version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Rename .exe
        shell: bash
        run: |
          mv dist/PysternBlot.exe "PysternBlot-${{ steps.version.outputs.tag }}-Windows.exe"

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: PysternBlot-${{ steps.version.outputs.tag }}-Windows
          path: PysternBlot-${{ steps.version.outputs.tag }}-Windows.exe
          retention-days: 7

      - name: Upload to GitHub Release (release runs)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: PysternBlot-${{ steps.version.outputs.tag }}-Windows.exe