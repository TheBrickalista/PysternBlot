[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysternblot"
version = "1.2.4"
description = "Western blot panel builder with hierarchical lane annotations (GPLv3)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Etienne Boulter" },
  { name = "Chloé C. Féral" }
]
keywords = [
  "western blot",
  "immunoblot",
  "image annotation",
  "provenance",
  "figure",
  "microscopy",
  "bioinformatics",
  "reproducibility"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization"
]
# Floors are raised by hand only and must equal the == pins in
# ci/requirements-min.in (enforced by tests/test_dependency_floors.py).
dependencies = [
  # <6.12: PySide6 6.12.0's binding modules (QtCore/QtGui/QtWidgets/QtSvg/
  # QtNetwork .abi3.so, libpyside6, libshiboken6) are built for macOS 26.0
  # (minos), but the macOS app declares LSMinimumSystemVersion 15.0, so the
  # release build fails; the wheels are tagged macosx_14_0, so pip would also
  # install them on macOS 14/15. 6.11.2's binding modules are built for 15.0.
  "PySide6>=6.11.2,<6.12",
  "pydantic>=2.6",
  "numpy>=1.24",
  "Pillow>=13.0.0",
  "tifffile>=2023.1.23",
  "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-timeout>=2.3.1",
  "pip-audit>=2.7",
  "twine>=6.1",
  "pyyaml>=6.0.1",
  "pyflakes>=3.2"
]
build = [
  "pyinstaller>=6.21"
]

[project.urls]
Homepage = "https://github.com/TheBrickalista/PysternBlot"
Repository = "https://github.com/TheBrickalista/PysternBlot"
Issues = "https://github.com/TheBrickalista/PysternBlot/issues"

[project.scripts]
pysternblot = "pysternblot.main:main"

[tool.setuptools.package-data]
pysternblot = ["resources/*", "resources/**/*"]

[tool.uv]
# A floor only, never == or an upper bound: Dependabot runs its own bundled
# uv (0.13.5 as of Nov 2026) and fails every uv.lock update with
# tool_version_not_supported when it falls outside this spec. CI pins the
# exact version in every setup-uv step (tests/test_workflows_hardening.py).
required-version = ">=0.13.5"
constraint-dependencies = [
  "pip>=26.2"
]

[tool.pytest.ini_options]
# A per-test cap so a real hang fails fast with a traceback instead of
# running out the CI job's timeout-minutes. 120s is generous headroom over
# the slowest individual test locally (well under 1s); it exists to catch
# unexpected blocking (e.g. a stray real network call), not to bound normal
# runtime.
timeout = 120
