[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysternblot"
version = "1.2.1"
description = "Western blot panel builder with hierarchical lane annotations (GPLv3)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Etienne Boulter" },
  { name = "Chloé C. Féral" }
]
keywords = [
  "western blot",
  "immunoblot",
  "image annotation",
  "provenance",
  "figure",
  "microscopy",
  "bioinformatics",
  "reproducibility"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization"
]
# Floors are raised by hand only and must equal the == pins in
# ci/requirements-min.in (enforced by tests/test_dependency_floors.py).
dependencies = [
  "PySide6>=6.11.2",
  "pydantic>=2.6",
  "numpy>=1.24",
  "Pillow>=12.3.0",
  "tifffile>=2023.1.23",
  "certifi>=2024.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-timeout>=2.3.1",
  "pip-audit>=2.7",
  "twine>=6.1",
  "pyyaml>=6.0.1",
  "pyflakes>=3.2"
]
build = [
  "pyinstaller>=6.21"
]

[project.urls]
Homepage = "https://github.com/TheBrickalista/PysternBlot"
Repository = "https://github.com/TheBrickalista/PysternBlot"
Issues = "https://github.com/TheBrickalista/PysternBlot/issues"

[project.scripts]
pysternblot = "pysternblot.main:main"

[tool.setuptools.package-data]
pysternblot = ["resources/*", "resources/**/*"]

[tool.uv]
required-version = "==0.11.31"
constraint-dependencies = [
  "pip>=26.2"
]

[tool.pytest.ini_options]
# A per-test cap so a real hang fails fast with a traceback instead of
# running out the CI job's timeout-minutes. 120s is generous headroom over
# the slowest individual test locally (well under 1s); it exists to catch
# unexpected blocking (e.g. a stray real network call), not to bound normal
# runtime.
timeout = 120
