name: Build Windows App

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-2025-vs2026
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Generate .ico icon from logo PNG
        shell: bash
        run: |
          mkdir -p build
          python - <<'EOF'
          from PIL import Image
          import struct, io

          src = Image.open("pysternblot/resources/pb_logo2.png").convert("RGBA")

          # Generate all standard Windows icon sizes
          sizes = [16, 24, 32, 48, 64, 128, 256]
          frames = []
          for s in sizes:
              frame = src.resize((s, s), Image.LANCZOS)
              frames.append(frame)

          # Save each size as PNG (lossless, best quality)
          # then bundle into .ico with PNG-compressed frames
          png_bufs = []
          for frame in frames:
              buf = io.BytesIO()
              frame.save(buf, format="PNG", optimize=True)
              png_bufs.append(buf.getvalue())

          # Write .ico file manually with PNG-compressed frames
          # ICO header: reserved(2) + type(2) + count(2)
          n = len(frames)
          header = struct.pack("<HHH", 0, 1, n)

          # Each directory entry: width(1) + height(1) + colorcount(1) +
          # reserved(1) + planes(2) + bitcount(2) + size(4) + offset(4)
          dir_size = n * 16
          data_offset = 6 + dir_size

          entries = b""
          data = b""
          offset = data_offset
          for frame, png in zip(frames, png_bufs):
              w = frame.width if frame.width < 256 else 0  # 0 means 256 in ICO
              h = frame.height if frame.height < 256 else 0
              entries += struct.pack("<BBBBHHII", w, h, 0, 0, 1, 32,
                                    len(png), offset)
              data += png
              offset += len(png)

          with open("build/pysternblot.ico", "wb") as f:
              f.write(header + entries + data)

          print(f"Icon generated: {len(frames)} sizes, "
                f"{sum(len(p) for p in png_bufs)} bytes total")
          EOF

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller `
            --name "PysternBlot" `
            --windowed `
            --onefile `
            --noconfirm `
            --icon "build/pysternblot.ico" `
            --add-data "pysternblot/resources;pysternblot/resources" `
            launcher.py

      - name: Set version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Rename .exe
        shell: bash
        run: |
          mv dist/PysternBlot.exe "PysternBlot-${{ steps.version.outputs.tag }}-Windows.exe"

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PysternBlot-${{ steps.version.outputs.tag }}-Windows
          path: PysternBlot-${{ steps.version.outputs.tag }}-Windows.exe
          retention-days: 7

      - name: Upload to GitHub Release (release runs)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: PysternBlot-${{ steps.version.outputs.tag }}-Windows.exe
