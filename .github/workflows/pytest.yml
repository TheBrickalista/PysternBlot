name: Tests

on:
  pull_request:
    branches:
      - devtoprod
      - production
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxcb-cursor0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify Qt TIFF plugin loads
        run: |
          uv run python -c "
          from PySide6.QtGui import QImageWriter
          f = sorted(bytes(x).decode() for x in QImageWriter.supportedImageFormats())
          print('writable formats:', f)
          assert 'tiff' in f, 'Qt TIFF plugin did not load'
          "

      - name: Run tests
        run: uv run pytest tests/ -v

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pip-audit
        run: uv run pip-audit
